name: CI Workflow

# Policies run job in branches
on: 
  push: 
    branches:
      - feature/create-pipeline

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Workflow reference => (Monorepo - NodeJS and ReactJS) pipeline base CI
  golden_ci:
    name: "Continuous Integration"
    uses: innovats-hub/devsecops-pipelines/.github/workflows/base-ci.yml@feature/golden-pipeline-nodejs
    with:
      globals_package_manager: "yarn"
      globals_node_version: "20.18.2"
      globals_runner_image: "ubuntu-latest"
      job_build_app_build_args: "build:backend --config ../../app-config.yaml"
      job_build_app_path_compress_build: "packages/backend/dist"
      job_build_image_path_extract_build: "packages/backend/"